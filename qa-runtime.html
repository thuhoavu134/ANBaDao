<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồn Việt — kiểm tra khung hình</title>
<style>body{margin:0;background:#253c42;color:white;font:14px system-ui}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:9px;cursor:pointer}iframe{display:block;border:0;width:390px;height:844px;background:#eef7f2}main{padding:10px;overflow:auto}small{opacity:.8}</style></head>
<body><header><b>Kiểm tra bố cục</b><button data-size="390,844">Điện thoại 390 × 844</button><button data-size="430,932">Điện thoại 430 × 932</button><button data-size="1280,900">PC 1280 × 900</button><small>Khung hẹp kiểm tra CSS; không thay cho thiết bị Safari thật.</small></header><main><iframe id="gamePreview" title="Game kiểm tra" src="./index.html?runtimeQA=1" allow="autoplay; fullscreen"></iframe></main>
<script>document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{const [w,h]=button.dataset.size.split(',');const frame=document.getElementById('gamePreview');frame.style.width=w+'px';frame.style.height=h+'px';}));</script></body></html>
