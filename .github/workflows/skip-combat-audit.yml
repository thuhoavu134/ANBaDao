name: Skip combat audit
on:
  push:
    branches: ['review/full-game-ui-20261006']
    paths: ['scripts/battle-instant-skip-v1.mjs','src/runtime/battle-instant-skip.js','scripts/qa-instant-skip*.mjs','scripts/qa-battle-readiness-browser.mjs','.github/workflows/skip-combat-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  skip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - name: Win loss and settlement
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-instant-skip.mjs
      - name: Actual host and reentry
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-instant-skip-host.mjs
