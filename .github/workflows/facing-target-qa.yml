name: Facing target QA
on:
  push:
    branches: ['review/full-game-ui-20261006']
    paths: ['scripts/battle-formation-targeting-v1.mjs','scripts/qa-facing-target-browser.mjs','tests/facing-action-target.test.mjs','.github/workflows/facing-target-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - run: node --test tests/facing-action-target.test.mjs tests/formation-order-targeting.test.mjs
      - run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-facing-target-browser.mjs
