name: Full game UI audit
on:
  push:
    branches: ['review/full-game-ui-20261006']
    paths: ['scripts/**','src/**','tests/**','index.html','.github/workflows/full-game-ui-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - name: Full tests
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Actual guest AFK canvas
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-real-host-afk.mjs
      - name: Formation and authored AFK geometry
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-iphone-afk-visual.mjs
      - name: Real host battle entry and return
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-host-battle-entry.mjs
      - name: Inspect every actual screen
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-full-game-ui-audit.mjs
