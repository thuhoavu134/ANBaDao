name: Owner combat trace
on:
  push:
    branches: ['review/full-game-ui-20261006']
    paths: ['scripts/qa-owner-combat-oct7.mjs','scripts/versioned-basic-dispatch-v1.mjs','src/ui/campaign-scene.css','.github/workflows/owner-combat-trace.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - run: node --test tests/versioned-basic-dispatch.test.mjs tests/formation-order-targeting.test.mjs
      - run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-owner-combat-oct7.mjs
