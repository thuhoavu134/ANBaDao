name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Battle VFX browser QA
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          "$CHROME_PATH" --version
          node scripts/qa-battle-readiness-browser.mjs
      - name: Upload battle VFX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-vfx-evidence
          path: evidence/browser/
          retention-days: 7
          compression-level: 0
      - name: Authored legacy hero browser QA
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          "$CHROME_PATH" --version
          node scripts/qa-authored-legacy-browser.mjs
      - name: Upload authored legacy hero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-legacy-evidence
          path: evidence/authored-legacy/
          retention-days: 7
          compression-level: 0
      - name: Direct skill test browser QA
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          "$CHROME_PATH" --version
          node scripts/qa-skill-test-browser.mjs
      - name: Upload direct skill test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-test-evidence
          path: evidence/skill-test/
          retention-days: 7
          compression-level: 0
      - name: Result motion browser QA
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          "$CHROME_PATH" --version
          node scripts/qa-result-motion-browser.mjs
      - name: Upload result motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-motion-evidence
          path: evidence/result-motion/
          retention-days: 7
          compression-level: 0
      - name: Round 15 result flow browser QA
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/qa-round15-result-flow.mjs
      - name: Upload round 15 result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round15-result-evidence
          path: evidence/round15-result/
          retention-days: 7
          compression-level: 0

      - name: Upload playable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playable-dist
          path: dist/
          retention-days: 3
          compression-level: 0

  production:
    name: Live check
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel production
        run: |
          set -eu
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://luc-than.vercel.app/ || true)
            echo "try $i live=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "luc-than.vercel.app did not return 200"
          exit 1
