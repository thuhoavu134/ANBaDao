name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: node --test --test-concurrency=1 tests/*.test.mjs

  production:
    name: Live check
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel production
        run: |
          set -eu
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://luc-than.vercel.app/ || true)
            echo "try $i live=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "luc-than.vercel.app did not return 200"
          exit 1
